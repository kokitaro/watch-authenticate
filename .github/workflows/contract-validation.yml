name: Contract validation

on:
  push:
    paths:
      - "backend/**"
      - "tests/**"
      - "requirements-contract.txt"
      - "pytest.ini"
      - ".github/workflows/contract-validation.yml"
  pull_request:
    paths:
      - "backend/**"
      - "tests/**"
      - "requirements-contract.txt"
      - "pytest.ini"
      - ".github/workflows/contract-validation.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-contract.txt
      - name: Install pinned contract tooling
        run: python -m pip install --requirement requirements-contract.txt
      - name: Validate GenVM contract
        run: genvm-lint check backend/watch-authenticate.py --json
      - name: Run direct contract tests
        run: python -m pytest tests/direct -v
